name: CI

on:
  push:
    branches:
      - dev/custom-runtime
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Agent and platform-safe tests
        if: matrix.os != 'windows-latest'
        run: npx vitest run src/agents src/skills src/plugins src/state/store.test.ts src/server/agent-tools.test.ts src/server/agent-piggyback.test.ts src/server/web-agent-tools.test.ts src/server/web-agent-stop-tool.test.ts src/server/web-agent-recovery.test.ts src/server/web-agent-parallel.test.ts src/server/skill-tools.test.ts src/server/skill-security-tools.test.ts src/server/plugin-tools.test.ts src/hooks src/control/win-native.test.ts src/control/win-uia.test.ts src/control/activity-indicator.test.ts

      - name: Agent tests (Windows)
        if: matrix.os == 'windows-latest'
        run: npx vitest run --testTimeout=10000 src/agents src/skills src/plugins src/state/store.test.ts src/server/agent-tools.test.ts src/server/agent-piggyback.test.ts src/server/web-agent-tools.test.ts src/server/web-agent-stop-tool.test.ts src/server/web-agent-recovery.test.ts src/server/web-agent-parallel.test.ts src/server/skill-tools.test.ts src/server/skill-security-tools.test.ts src/server/plugin-tools.test.ts src/hooks

      - name: Windows native input helper test
        if: matrix.os == 'windows-latest'
        run: npx vitest run src/control/win-native.test.ts

      - name: Windows UIA helper test
        if: matrix.os == 'windows-latest'
        run: npx vitest run src/control/win-uia.test.ts

      - name: Windows activity indicator helper test
        if: matrix.os == 'windows-latest'
        run: npx vitest run src/control/activity-indicator.test.ts

      - name: Windows public hostname resolver test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/test-windows-public-hostname.ps1

      - name: Windows startup context test
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/test-windows-startup-context.ps1

      - name: Build
        run: npm run build

      - name: Build Windows launcher
        if: matrix.os == 'windows-latest'
        run: npm run windows:exe

  macos-tests:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
