name: Cua window identity validation

on:
  push:
    branches: [feat/cua-driver-ab-benchmark]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Parse identity wrapper
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE "scripts/benchmark-cua-window-identity-fast-path.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Compile identity fixture
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/fixtures/computer-use-benchmark.ps1 -SourcePath scripts/fixtures/cua-window-identity.cs -OutputPath "$env:RUNNER_TEMP\cua-window-identity.exe"
          if (-not (Test-Path "$env:RUNNER_TEMP\cua-window-identity.exe")) { throw "identity fixture compilation failed" }
