name: Windows PowerShell UTF8 JSON validation

on:
  push:
    branches: [feat/cua-driver-ab-benchmark]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse wrapper with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE "scripts/benchmark-cua-real-app-fast-path.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Verify UTF-8 JSON parsing with localized titles
        shell: powershell
        run: |
          $path = Join-Path $env:RUNNER_TEMP "localized.json"
          $memo = -join @([char]0xBA54, [char]0xBAA8, [char]0xC7A5)
          $profile = -join @([char]0xD504, [char]0xB85C, [char]0xD544)
          $title = "$memo - $profile 1 - Microsoft Edge"
          $json = '{"title":"' + $title + '","ok":true}'
          [System.IO.File]::WriteAllText($path, $json, (New-Object System.Text.UTF8Encoding($false)))
          $text = [System.IO.File]::ReadAllText($path, [System.Text.Encoding]::UTF8)
          $parsed = $text | ConvertFrom-Json
          if ($parsed.title -ne $title -or -not $parsed.ok) {
            throw "UTF-8 JSON round-trip failed"
          }
