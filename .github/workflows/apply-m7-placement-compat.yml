name: Apply M7 placement compatibility fix

on:
  push:
    branches: [dev/custom-runtime]
    paths:
      - scripts/m7-placement-compat.py
      - .github/workflows/apply-m7-placement-compat.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compatibility adjustment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/m7-placement-compat.py
          git diff --check
      - name: Commit source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agents/manager.ts
          git commit -m "fix: preserve deferred worker route mapping"
          git push origin HEAD:dev/custom-runtime
