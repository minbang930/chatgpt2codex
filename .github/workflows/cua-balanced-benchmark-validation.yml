name: Cua balanced benchmark validation

on:
  push:
    branches: [feat/cua-driver-ab-benchmark]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Parse PowerShell helpers
        shell: pwsh
        run: |
          $files = @(
            "scripts/benchmark-cua-driver-fast-path.ps1",
            "scripts/benchmark-cua-real-app-fast-path.ps1",
            "scripts/build-cua-driver-fast-path.ps1",
            "scripts/fixtures/computer-use-benchmark.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $env:GITHUB_WORKSPACE $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "Parsed: $file"
          }
      - name: Compile WinForms fixture
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/fixtures/computer-use-benchmark.ps1 -SourcePath scripts/fixtures/computer-use-benchmark.cs -OutputPath "$env:RUNNER_TEMP\cu-winforms.exe"
      - name: Compile WPF fixture
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/fixtures/computer-use-benchmark.ps1 -SourcePath scripts/fixtures/computer-use-benchmark-wpf.cs -OutputPath "$env:RUNNER_TEMP\cu-wpf.exe"
