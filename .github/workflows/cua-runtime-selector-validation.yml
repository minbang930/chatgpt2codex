name: Cua runtime selector validation

on:
  push:
    branches: [feat/cua-driver-ab-benchmark]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run Cua runtime selector tests
        run: npx vitest run src/control/cua-driver-command.test.ts src/control/cua-driver-error.test.ts
      - name: Parse installer
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE "scripts/install-cua-driver-fast-path.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Exercise persistent installer with isolated HOME
        shell: powershell
        run: |
          $fake = Join-Path $env:RUNNER_TEMP "cua-driver-fast-path.exe"
          [System.IO.File]::WriteAllBytes($fake, [byte[]](1,2,3,4,5,6,7,8))
          $oldHome = $env:HOME
          $env:HOME = Join-Path $env:RUNNER_TEMP "home"
          New-Item -ItemType Directory -Force -Path $env:HOME | Out-Null
          try {
            $installed = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/install-cua-driver-fast-path.ps1 -SourcePath $fake | Select-Object -Last 1
            $expected = Join-Path $env:HOME ".local\share\chatgpt2codex\cua-driver\fast-path\cua-driver.exe"
            if ($installed -ne $expected) { throw "unexpected install path: $installed" }
            if (-not (Test-Path -LiteralPath $expected -PathType Leaf)) { throw "installed file missing" }
            $a = (Get-FileHash -Algorithm SHA256 -LiteralPath $fake).Hash
            $b = (Get-FileHash -Algorithm SHA256 -LiteralPath $expected).Hash
            if ($a -ne $b) { throw "installed file hash mismatch" }
          } finally {
            $env:HOME = $oldHome
          }
