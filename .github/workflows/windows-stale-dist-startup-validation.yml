name: Windows stale dist startup validation

on:
  push:
    branches: [feat/cua-driver-ab-benchmark]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse start-chatgpt PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE "start-chatgpt.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify compiled catalog contains computer_launch_app
        shell: powershell
        run: |
          $hit = Get-ChildItem -LiteralPath dist -Recurse -File -Filter "*.js" |
            Select-String -SimpleMatch "computer_launch_app" |
            Select-Object -First 1
          if (-not $hit) { throw "compiled dist does not contain computer_launch_app" }
          Write-Host $hit.Path
