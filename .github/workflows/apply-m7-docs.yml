name: Apply M7 completion docs

on:
  push:
    branches: [dev/custom-runtime]
    paths: [.github/workflows/apply-m7-docs.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update M7 documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          progress = Path('docs/CUSTOM-RUNTIME-PROGRESS.md')
          text = progress.read_text()
          text = text.replace('Overall phase: **M6 - Worker Execution Configuration — complete**', 'Overall phase: **M7 - Worker Placement Policy — complete**')
          text = text.replace('Active unit: **M6 complete; select the next roadmap unit before implementation**', 'Active unit: **M7 complete; select the next roadmap unit before implementation**')
          text = text.replace('Detailed live-validation record: `docs/M6-LIVE-VALIDATION.md`.', 'Detailed live-validation records: `docs/M6-LIVE-VALIDATION.md` and `docs/M7-WORKER-PLACEMENT.md`.')
          marker = '## Current queue\n'
          section = '''## M7 - Worker Placement Policy — complete\n\nDesign/live evidence: `docs/M7-WORKER-PLACEMENT.md`.\n\n- [x] Windows EXE settings expose `Worker ChatGPT Project URL`.\n- [x] A configured fixed URL forces every new Worker into that ChatGPT Project.\n- [x] Fixed EXE placement outranks an explicit per-worker `standalone` request.\n- [x] With the EXE URL blank, `agent_spawn` can request either `standalone` or a specific ChatGPT Project URL per worker.\n- [x] With no per-worker request, the existing local-project -> ChatGPT-Project mapping remains available, with standalone fallback.\n- [x] Placement is persisted durably per Worker once resolved so later mutable settings do not silently move an existing Worker.\n- [x] Existing `agent_project_route_set` deferred-routing behavior remains compatible.\n- [x] Invalid/non-ChatGPT fixed URLs fail before browser submission.\n- [x] Final cross-platform CI green: run `35175254790` on `1eaf8fa75c24bf814b37090e5f0b4a02bfabb7bd`.\n- [x] Live Windows validation confirmed fixed placement, fixed-over-standalone precedence, blank+standalone, and blank+specific-project placement.\n\n'''
          if section not in text:
              text = text.replace(marker, section + marker)
          text = text.replace('- [ ] Select the next roadmap unit before implementation; M6 requires no further validation unless ChatGPT UI/account behavior changes.', '- [ ] Select the next roadmap unit before implementation; M7 core placement behavior is complete.')
          progress.write_text(text)

          handoff = Path('docs/SESSION-HANDOFF.md')
          text = handoff.read_text()
          text = text.replace('M0-M5, blocking post-M5 stabilization, and **M6 - Worker Execution Configuration are complete**.', 'M0-M5, blocking post-M5 stabilization, **M6 - Worker Execution Configuration**, and **M7 - Worker Placement Policy are complete**.')
          anchor = 'Final M6 cross-platform CI: GitHub Actions run `35172617811` on post-validation HEAD `5dac24f96bd9ae162ad26a0b29bfeb96883526bd` passed Ubuntu, macOS, and Windows.\n'
          addition = anchor + '\nFinal M7 cross-platform CI: GitHub Actions run `35175254790` on `1eaf8fa75c24bf814b37090e5f0b4a02bfabb7bd` passed Ubuntu, macOS, and Windows, including the Windows launcher build.\n'
          text = text.replace(anchor, addition)
          before = '## How to work with the user\n'
          m7 = '''## M7 completed contract\n\nM7 adds a Worker placement policy without changing repository authority or Worker MCP isolation. The Windows launcher exposes a `Worker ChatGPT Project URL` setting. When non-empty, it is passed to the runtime as `CHATGPT2CODEX_WORKER_PROJECT_URL` and forces new workers into that ChatGPT Project. When blank, placement stays dynamic.\n\nPlacement precedence for a new Worker is:\n\n```text\nexisting durable Worker placement (recovery)\n  > EXE fixed Worker Project URL\n  > explicit per-worker placement from agent_spawn\n  > existing local-project -> ChatGPT-Project mapping\n  > standalone ChatGPT\n```\n\nCompatibility detail: when neither a fixed EXE URL nor an explicit per-worker placement exists, project mapping is intentionally resolved at first launch rather than at spawn. This preserves the established `agent_spawn -> agent_project_route_set -> agent_launch` workflow. Once the first route is resolved, it is persisted for that Worker.\n\nLive Windows evidence:\n\n- fixed URL with no Project mention created the Worker in the configured Project;\n- worker `wrk_0dc5fe1c-d919-46a2-9f3e-4cbbce5995b8` requested `standalone` while the EXE fixed URL was set, but launched in the fixed Project and completed with `changedFiles=[]`;\n- worker `wrk_f3f6ddb0-a6f5-4706-9090-6aa04b8e0900` launched standalone when the EXE field was blank and completed with `changedFiles=[]`;\n- worker `wrk_caa6c047-cd2f-4ff7-bf6c-f750fdcd5f2e` requested a specific Project while the EXE field was blank, and the actual `browser.projectUrl` matched exactly before task submission.\n\nDetailed evidence: `docs/M7-WORKER-PLACEMENT.md`.\n\n'''
          if m7 not in text:
              text = text.replace(before, m7 + before)
          text = text.replace('- `docs/M6-LIVE-VALIDATION.md` — detailed M6.5 live evidence and final CI.', '- `docs/M6-LIVE-VALIDATION.md` — detailed M6.5 live evidence and final CI.\n- `docs/M7-WORKER-PLACEMENT.md` — M7 placement policy, implementation, live validation, and final CI.')
          text = text.replace('4. Read `docs/M6-LIVE-VALIDATION.md` only when execution-configuration/live Worker details are relevant.\n5. If docs and repo disagree, trust repo and correct the docs.', '4. Read `docs/M6-LIVE-VALIDATION.md` only when execution-configuration/live Worker details are relevant.\n5. Read `docs/M7-WORKER-PLACEMENT.md` when Worker ChatGPT Project placement/routing is relevant.\n6. If docs and repo disagree, trust repo and correct the docs.')
          text = text.replace('M6 no longer needs further live validation unless a future ChatGPT UI/account change breaks the established adapter contract.', 'M6 and M7 core contracts are complete. Revalidate only when future ChatGPT UI/account changes or placement-policy changes affect the established behavior.')
          handoff.write_text(text)

          routing = Path('docs/CHATGPT-PROJECT-WORKER-ROUTING.md')
          text = routing.read_text()
          text = text.replace('When a local repository is linked to a ChatGPT Project, new worker chats should be created inside that ChatGPT Project. Project placement is only for UI organization. Repository authority comes from the dedicated worker MCP app plus the existing worker capability/worktree model.', 'Worker chats can be placed dynamically or forced into one ChatGPT Project. Project placement is only for UI organization. Repository authority comes from the dedicated worker MCP app plus the existing worker capability/worktree model.')
          map_anchor = 'Recommended default: one repository per ChatGPT Project.\n'
          map_add = map_anchor + '''\nM7 adds a Windows EXE-level fixed placement setting and per-worker placement requests. Effective precedence is:\n\n```text\nexisting durable Worker placement (recovery)\n  > fixed EXE Worker Project URL\n  > explicit per-worker placement\n  > local repository mapping\n  > standalone\n```\n\nIf the EXE setting is blank, callers may request `placement.mode="standalone"` or `placement.mode="project"` with a `projectUrl` in `agent_spawn`. If they omit placement, the existing repository mapping/fallback behavior is preserved.\n'''
          text = text.replace(map_anchor, map_add)
          launch_old = '''agent_spawn\n -> resolve local project\n -> resolve optional ChatGPT Project reference\n -> prepare isolated worker workspace\n -> open the mapped ChatGPT Project, or use a standalone chat when no mapping exists\n -> select the dedicated ChatGPT To Codex Worker app for the task message\n -> send the worker task + scoped worker capability\n -> mark the worker running after launch succeeds'''
          launch_new = '''agent_spawn\n -> resolve local project\n -> apply fixed EXE placement when configured, otherwise accept optional per-worker placement\n -> prepare isolated worker workspace\n -> if still unresolved, resolve current local-project mapping at first launch\n -> persist the resolved Worker placement\n -> open that ChatGPT Project or standalone chat\n -> select the dedicated ChatGPT To Codex Worker app for the task message\n -> send the worker task + scoped worker capability\n -> mark the worker running after launch succeeds'''
          text = text.replace(launch_old, launch_new)
          text += '''\n## M7 Worker Placement Policy\n\nM7 is complete. The Windows launcher stores `WorkerProjectUrl` in its settings and exports the normalized value to the runtime as `CHATGPT2CODEX_WORKER_PROJECT_URL`. A non-empty value is authoritative for new Worker placement and overrides per-worker placement requests.\n\nWhen the setting is empty, placement is dynamic. `agent_spawn` accepts an optional per-worker placement request, while callers that omit it continue using the established project mapping or standalone fallback. Existing Workers keep their resolved route through browser attempts rather than being silently moved by later setting changes.\n\nThe implementation deliberately preserves deferred project mapping: a Worker with neither fixed nor explicit per-worker placement is not pinned at spawn, so `agent_project_route_set` may still be called before the first `agent_launch`.\n\nLive Windows validation covered fixed placement, fixed-over-standalone precedence, explicit standalone with an empty setting, and explicit Project placement with an empty setting. Final CI run `35175254790` passed Ubuntu, macOS, and Windows, including the Windows launcher build. See `docs/M7-WORKER-PLACEMENT.md` for the detailed evidence.\n'''
          routing.write_text(text)

          m7doc = Path('docs/M7-WORKER-PLACEMENT.md')
          m7doc.write_text('''# M7 Worker Placement Policy\n\nStatus: **complete**\n\n## Goal\n\nAllow the Windows EXE to control where newly created ChatGPT Web workers live without changing repository authority. A configured Worker ChatGPT Project URL must force all new workers into that Project. When the field is blank, placement remains dynamic and may be standalone, explicitly requested per worker, or inherited from the existing local-project mapping.\n\n## Contract\n\n```text\nexisting durable Worker placement (recovery)\n  > EXE fixed Worker Project URL\n  > agent_spawn per-worker placement\n  > local-project -> ChatGPT-Project mapping\n  > standalone ChatGPT\n```\n\nA route becomes durable once resolved for the Worker. Recovery/browser attempts reuse that Worker placement rather than re-reading mutable settings and moving the Worker. For compatibility, when neither fixed nor explicit per-worker placement is present, the project mapping remains deferred until first launch so `agent_project_route_set` can still run between spawn and launch.\n\n## Windows launcher\n\nThe Settings dialog contains `Worker ChatGPT Project URL`.\n\n- Blank: automatic/dynamic placement.\n- Non-empty valid `https://chatgpt.com/...` URL: every new Worker is forced into that Project.\n- The value is persisted as `WorkerProjectUrl` and passed to the runtime as `CHATGPT2CODEX_WORKER_PROJECT_URL`.\n- Invalid non-ChatGPT URLs are rejected.\n\n## Per-worker placement\n\nWith no fixed EXE URL, `agent_spawn` may request:\n\n```text\nplacement.mode = standalone\n```\n\nor:\n\n```text\nplacement.mode = project\nplacement.projectUrl = https://chatgpt.com/.../project\n```\n\nThis is independent of model/reasoning execution intent and does not grant any repository or MCP authority.\n\n## Implementation\n\nRelevant implementation sequence:\n\n- `79be0f6e5587ec606ebe365a7e9dca234cdff790` — fixed EXE/runtime placement plus durable browser placement state and tests.\n- `411a2868f3198f31b6236fa79fbcdfeded9db9a8` — explicit per-worker Project/standalone placement requests.\n- `37db3f64bb905982134aa58631c215713b7c8062` — preserve deferred `agent_project_route_set` compatibility.\n- final tested tree: `1eaf8fa75c24bf814b37090e5f0b4a02bfabb7bd`.\n\nPrimary changed source/tests:\n\n- `src/agents/browser-controller.ts`\n- `src/agents/manager.ts`\n- `src/server/agent-tools.ts`\n- `src/agents/browser-placement-policy.test.ts`\n- `src/agents/manager-placement.test.ts`\n- `windows/ChatGPTToCodexLauncher.cs`\n\n## Automated validation\n\nFinal GitHub Actions run `35175254790` on `1eaf8fa75c24bf814b37090e5f0b4a02bfabb7bd`:\n\n- Ubuntu: success — typecheck, agent/platform-safe tests, build.\n- macOS: success — typecheck, full test, build.\n- Windows: success — typecheck, Agent tests, native/UIA/activity/public-host/startup helper tests, Node build, and Windows launcher build.\n\nAn intermediate regression was caught by CI: pinning the default standalone route at spawn prevented the established `agent_spawn -> agent_project_route_set -> agent_launch` flow. The final implementation only pins at spawn when a fixed EXE URL or explicit per-worker placement exists; otherwise mapping resolution remains deferred until first launch.\n\n## Live Windows validation\n\n### Fixed URL, no explicit Project request\n\nAfter pulling/building locally, the EXE setting was populated and a fresh chat requested a Worker without mentioning placement. The Worker was created inside the configured ChatGPT Project.\n\n### Fixed URL overrides per-worker standalone\n\nWorker `wrk_0dc5fe1c-d919-46a2-9f3e-4cbbce5995b8`:\n\n- requested placement: `standalone`;\n- actual route: `project`;\n- actual URL: `https://chatgpt.com/g/g-p-6aab2b62ecc8819190c854618ecffaba-test-project-1/project`;\n- launch: success on attempt 1;\n- durable status: `completed`;\n- README title: `# c2c-smoke`;\n- `changedFiles=[]`.\n\nThis proves the fixed EXE setting outranks a conflicting per-worker request.\n\n### Blank EXE setting + explicit standalone\n\nWorker `wrk_f3f6ddb0-a6f5-4706-9090-6aa04b8e0900`:\n\n- requested placement: `standalone`;\n- actual route: `standalone`;\n- launch: success on attempt 1;\n- durable status: `completed`;\n- README title: `# c2c-smoke`;\n- `changedFiles=[]`.\n\n### Blank EXE setting + explicit Project\n\nWorker `wrk_caa6c047-cd2f-4ff7-bf6c-f750fdcd5f2e`:\n\n- requested placement: `project`;\n- requested URL: `https://chatgpt.com/g/g-p-6aab2b62ecc8819190c854618ecffaba/project`;\n- actual route: `project`;\n- actual URL matched exactly;\n- launch succeeded on attempt 1 and the task was submitted.\n\nThe follow-up `agent_wait` was blocked by the calling system, so final README/changedFiles were not collected for this worker. That does not affect placement validation because the browser route and exact requested Project URL were already observed after successful launch/submission.\n\n## Completion decision\n\nM7 core functionality is complete. Live recovery of an M7-created Worker may be rechecked later as an optional regression smoke, but it is not required to close the feature: durable route reuse is covered by automated placement/recovery behavior and the pre-existing Worker recovery contract remains intact.\n''')
          PY
          git rm .github/workflows/apply-m7-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CUSTOM-RUNTIME-PROGRESS.md docs/SESSION-HANDOFF.md docs/CHATGPT-PROJECT-WORKER-ROUTING.md docs/M7-WORKER-PLACEMENT.md
          git commit -m 'docs: close M7 worker placement policy'
          git push origin HEAD:dev/custom-runtime
