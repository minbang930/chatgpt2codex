name: Apply M7 per-worker placement follow-up

on:
  push:
    branches: [dev/custom-runtime]
    paths:
      - scripts/m7-worker-placement-followup.py
      - .github/workflows/apply-m7-worker-placement-followup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source transformation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/m7-worker-placement-followup.py
          git diff --check
          git status --short
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agents/browser-controller.ts src/agents/browser-placement-policy.test.ts src/agents/manager.ts src/agents/manager-placement.test.ts src/server/agent-tools.ts
          git commit -m "feat: add per-worker placement requests"
          git push origin HEAD:dev/custom-runtime
