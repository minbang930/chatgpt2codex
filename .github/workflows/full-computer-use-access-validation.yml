name: Full Computer Use access validation

on:
  push:
    branches: [feat/cua-driver-ab-benchmark]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run access policy tests
        run: npx vitest run src/control/policy.test.ts src/control/screenshot-mask.test.ts src/control/auto.test.ts

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build launcher EXE
        run: npm run windows:exe
      - name: Verify Full Control setting is compiled from source
        shell: powershell
        run: |
          $source = [System.IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE "windows/ChatGPTToCodexLauncher.cs"))
          foreach ($needle in @(
            "ControlAccessMode",
            "CHATGPT2CODEX_CONTROL_ACCESS_MODE",
            "Computer Use 전체 권한 (Admin)",
            "Full Computer Use access (Admin)"
          )) {
            if (-not $source.Contains($needle)) { throw "missing launcher setting: $needle" }
          }

  control-surface:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Run control integration tests
        run: npx vitest run src/server/control-tools.test.ts src/server/control-screenshot.test.ts src/control/executor.test.ts
