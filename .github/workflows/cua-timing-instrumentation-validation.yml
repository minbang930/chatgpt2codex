name: Cua timing instrumentation validation

on:
  push:
    branches:
      - feat/cua-driver-ab-benchmark

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run benchmark:computer-use -- --backends legacy --iterations 1
