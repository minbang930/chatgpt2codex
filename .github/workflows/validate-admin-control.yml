name: Validate Admin Control Lease

on:
  push:
    branches:
      - feat/cua-driver-ab-benchmark

permissions:
  contents: read

jobs:
  windows-admin-control:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Store tests
        run: npx vitest run src/state/store.test.ts
      - name: Targeted Admin control lease tests
        run: npx vitest run src/server/control-tools.test.ts -t "full access auto-grants|kill switch revokes"
      - name: Build
        run: npm run build
      - name: Build Windows launcher
        run: npm run windows:exe
