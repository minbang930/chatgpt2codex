name: Cua resolved runtime reporting validation

on:
  push:
    branches: [feat/cua-driver-ab-benchmark]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/control/cua-driver-command.test.ts src/control/cua-driver-error.test.ts
