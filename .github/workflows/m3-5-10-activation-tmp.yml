name: M3.5.10 activation temporary

on:
  push:
    branches: [dev/custom-runtime]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/custom-runtime
          fetch-depth: 0
      - name: Apply M3.5.10 patch
        run: python scripts/m3_5_10_activation_patch.py
      - name: Commit M3.5.10
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/m3_5_10_activation_patch.py
          git add src/control/win-native.ts
          git commit -m "fix: strengthen Windows Computer Use activation"
          git push origin HEAD:dev/custom-runtime
